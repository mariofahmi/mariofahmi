name: Update Traffic Chart

on:
  schedule:
    - cron: '0 1 * * *'   # Setiap hari jam 01:00 UTC (08:00 WIB)
  workflow_dispatch:        # Bisa dijalankan manual juga

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate traffic chart
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python generate_chart.py

      - name: Commit & push chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/traffic-chart.svg
          git diff --staged --quiet || git commit -m "auto: update traffic chart $(date +'%Y-%m-%d')"
          git push
