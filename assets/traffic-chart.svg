<svg xmlns="http://www.w3.org/2000/svg" width="780" height="296" viewBox="0 0 780 296">
  <defs>
    <!-- Deep Glassmorphism Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Card Border Aurora Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Title Aurora Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Rank 1 Gold Flame Gradient -->
    <linearGradient id="barGrad0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Rank 2 Cyber Cyan Gradient -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Rank 3 Radiant Sunset Gradient -->
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shadowFilter" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Main Background Container -->
  <rect width="780" height="296" rx="16" fill="url(#bgGrad)" filter="url(#shadowFilter)"/>
  <rect width="780" height="296" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Ambient Glow Effect in Top Right -->
  <circle cx="720" cy="40" r="90" fill="#38bdf8" fill-opacity="0.05" filter="blur(20px)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 22)">
    <!-- Fire Icon with Glow -->
    <rect x="0" y="0" width="30" height="30" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <text x="15" y="21" font-size="15" text-anchor="middle">🔥</text>

    <!-- Header Titles -->
    <text x="38" y="16" fill="url(#titleGrad)" font-size="15" font-weight="800" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" letter-spacing="0.3px">Most Popular Projects</text>
    <text x="38" y="29" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif">Last 14 Days Activity · High Traffic Ranking</text>

    <!-- Right Header Pill -->
    <rect x="510" y="2" width="206" height="26" rx="13" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
    <text x="613" y="19" fill="#94a3b8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">
      <tspan fill="#38bdf8" font-weight="bold">177</tspan> views · 2026-09-22 05:51 UTC
    </text>
  </g>

  <!-- Header Divider -->
  <line x1="32" y1="62" x2="748" y2="62" stroke="#1e293b" stroke-width="1"/>

  <!-- Leaderboard Rows -->
  
  <!-- Row 1: 💰 NetWorth Anda -->
  <g transform="translate(32, 72)">
    <rect width="716" height="56" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="0.8"/>
    
    <!-- Rank Pill -->
    <rect x="12" y="10" width="50" height="20" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1"/>
    <text x="37" y="24" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">🥇 #1</text>
    
    <!-- Project Title (Generous unobstructed space) -->
    <text x="72" y="24" fill="#f8fafc" font-size="13.5" font-weight="700" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">💰 NetWorth Anda</text>
    
    <!-- Views Metric -->
    <text x="704" y="24" fill="#fbbf24" font-size="12.5" font-weight="bold" font-family="monospace" text-anchor="end">62 views <tspan fill="#64748b" font-weight="normal" font-size="11">(1 unique)</tspan></text>
    
    <!-- Progress Bar (Dedicated bottom tier, immune to text overlap) -->
    <rect x="12" y="38" width="692" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="12" y="38" width="692" height="7" rx="3.5" fill="url(#barGrad0)"/>
  </g>

  <!-- Row 2: 🔬 Metode Penelitian Sosial -->
  <g transform="translate(32, 136)">
    <rect width="716" height="56" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="0.8"/>
    
    <!-- Rank Pill -->
    <rect x="12" y="10" width="50" height="20" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="37" y="24" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">🥈 #2</text>
    
    <!-- Project Title (Generous unobstructed space) -->
    <text x="72" y="24" fill="#f8fafc" font-size="13.5" font-weight="700" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">🔬 Metode Penelitian Sosial</text>
    
    <!-- Views Metric -->
    <text x="704" y="24" fill="#38bdf8" font-size="12.5" font-weight="bold" font-family="monospace" text-anchor="end">44 views <tspan fill="#64748b" font-weight="normal" font-size="11">(1 unique)</tspan></text>
    
    <!-- Progress Bar (Dedicated bottom tier, immune to text overlap) -->
    <rect x="12" y="38" width="692" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="12" y="38" width="491" height="7" rx="3.5" fill="url(#barGrad1)"/>
  </g>

  <!-- Row 3: 🌱🦸 Pahlawan Cilik Siaga Lingkungan -->
  <g transform="translate(32, 200)">
    <rect width="716" height="56" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="0.8"/>
    
    <!-- Rank Pill -->
    <rect x="12" y="10" width="50" height="20" rx="6" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.5" stroke-width="1"/>
    <text x="37" y="24" fill="#fb923c" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">🥉 #3</text>
    
    <!-- Project Title (Generous unobstructed space) -->
    <text x="72" y="24" fill="#f8fafc" font-size="13.5" font-weight="700" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">🌱🦸 Pahlawan Cilik Siaga Lingkungan</text>
    
    <!-- Views Metric -->
    <text x="704" y="24" fill="#fb923c" font-size="12.5" font-weight="bold" font-family="monospace" text-anchor="end">36 views <tspan fill="#64748b" font-weight="normal" font-size="11">(1 unique)</tspan></text>
    
    <!-- Progress Bar (Dedicated bottom tier, immune to text overlap) -->
    <rect x="12" y="38" width="692" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="12" y="38" width="401" height="7" rx="3.5" fill="url(#barGrad2)"/>
  </g>


  <!-- ==================== FOOTER ==================== -->
  <line x1="32" y1="264" x2="748" y2="264" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Live Green Pulsing Indicator -->
  <circle cx="44" cy="279" r="4" fill="#22c55e"/>
  <circle cx="44" cy="279" r="7" fill="none" stroke="#22c55e" stroke-width="1.5">
    <animate attributeName="r" values="4;9" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="58" y="283" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif">Auto-synced daily via GitHub Actions</text>
  <text x="748" y="283" fill="#475569" font-size="10.5" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">UNIROW Tuban · Mario Fahmi</text>
</svg>